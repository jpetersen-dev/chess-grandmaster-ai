name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: '¿Crear GitHub Release?'
        required: false
        type: boolean
        default: true
      tag_name:
        description: 'Nombre de la versión (ej. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install npm dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/chess-grandmaster-ai-debug.apk
          ls -la release-artifacts/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-grandmaster-ai-apk
          path: release-artifacts/chess-grandmaster-ai-debug.apk
          retention-days: 30

      - name: Determine if release should be created
        id: release_check
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.create_release }}" == "true" ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag=${{ github.event.inputs.tag_name || 'v1.0.0' }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release with APK
        if: steps.release_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_check.outputs.tag }}
          name: Chess Grandmaster AI ${{ steps.release_check.outputs.tag }}
          body: |
            ### ♞ Chess Grandmaster AI - APK Release
            
            Versión instalable para Android de tu entrenador de ajedrez personalizado.
            
            #### Novedades y Características:
            - **Sincronización Chess.com**: Historial real de partidas de `jpeza`.
            - **Doble Motor de Análisis**: Stockfish 17 + Clasificador táctico algorítmico 100% offline.
            - **Google Gemini Grandmaster**: Diagnóstico psicológico y explicaciones pedagógicas de errores.
            - **Dojo SRS**: Flashcards con algoritmo de repetición espaciada basadas en tus propios fallos.
            - **Laboratorio de Repertorio**: Métricas de victorias/derrotas por variante de apertura.
            - **Sparring IA**: Motor de práctica con nivel Elo graduable.
            
            Descarga el archivo `chess-grandmaster-ai-debug.apk` e instálalo directamente en tu dispositivo Android.
          files: release-artifacts/chess-grandmaster-ai-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
